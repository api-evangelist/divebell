name: Divebell
description: >-
  Divebell is a cloud-native data privacy and security compliance platform that
  helps organizations discover, classify, and protect sensitive data and
  personally identifiable information (PII) across their data sources. The
  platform pairs continuous, intelligent data scanning with "Deep Automation"
  to deliver four capability areas: Data Discovery (data classification, data
  mapping, and access management), Compliance Automation (risk assessment, data
  retention, and regulatory compliance), DSR Fulfillment (data subject request
  workflows, subject mapping, and automated retrieval), and Risk Protection (a
  policy engine, "Risk Sonar," and remediation actions). Delivered as a
  lightweight modern SaaS with private data processing, Divebell protects
  customer data across sources such as Snowflake and AWS. Divebell was surfaced
  as a portfolio company of Uncork Capital and is now part of the Exterro family,
  operating as Exterro Data Discovery.
